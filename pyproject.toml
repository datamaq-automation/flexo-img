[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flexo-img"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Pillow==12.3.0; python_version < '3.11'",
    "Pillow==13.0.0; python_version >= '3.11'",
    "PyMuPDF==1.26.7",
    "defusedxml==0.7.1",
    "resvg-py==0.5.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.0.0", "ruff==0.16.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE"]

[tool.coverage.run]
source = ["flexo_img"]

[tool.coverage.report]
show_missing = true
fail_under = 85
